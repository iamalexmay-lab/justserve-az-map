<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>JustServe AZ — East Valley</title>
<style>
/* ── RESET & TOKENS ─────────────────────────────────────────── */
:root{
  --brand:#1B5E4F; --brand-dark:#0F3D32; --brand-light:#E8F4F1;
  --accent:#E8A020; --accent-light:#FDF3E0;
  --bg:#F7F6F2; --surface:#FFFFFF; --border:#E2E0D8;
  --text:#1A1A1A; --muted:#6B6B6B;
  --shadow:0 4px 24px rgba(0,0,0,0.13);
  --radius:10px;
  --header-h:52px;
  --tab-h:44px;
  --sidebar-w:270px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif}

/* ── HEADER ─────────────────────────────────────────────────── */
header{
  position:fixed;top:0;left:0;right:0;
  height:var(--header-h);
  background:var(--brand);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1rem;z-index:300;
}
.logo{display:flex;align-items:center;gap:8px;min-width:0}
.logo-icon{width:28px;height:28px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.logo-text{font-weight:700;font-size:14px;color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo-sub{font-size:9px;color:rgba(255,255,255,.6);margin-top:1px;display:none}
.hstats{display:flex;gap:1rem;flex-shrink:0}
.hstat-val{font-size:15px;font-weight:700;color:white;text-align:right}
.hstat-val.amber{color:#E8A020}.hstat-val.purple{color:#CE93D8}
.hstat-label{font-size:8px;color:rgba(255,255,255,.55);letter-spacing:.5px;text-align:right;text-transform:uppercase}

/* ── TAB BAR ────────────────────────────────────────────────── */
.tab-bar{
  position:fixed;top:var(--header-h);left:0;right:0;
  height:var(--tab-h);
  background:var(--brand-dark);
  display:flex;z-index:299;
}
.tab-btn{
  flex:1;font-size:13px;font-weight:500;
  color:rgba(255,255,255,.6);
  border:none;background:transparent;cursor:pointer;
  border-bottom:2.5px solid transparent;
  transition:all .2s;font-family:inherit;
  min-height:44px; /* touch target */
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.tab-btn.active{color:white;border-bottom-color:var(--accent)}
.tab-btn:hover{color:white}

/* ── MAIN LAYOUT ────────────────────────────────────────────── */
.app{
  position:fixed;
  top:calc(var(--header-h) + var(--tab-h));
  left:0;right:0;bottom:0;
  display:flex;overflow:hidden;
}
.tab-content{display:none;flex:1;overflow:hidden;flex-direction:row}
.tab-content.active{display:flex}

/* ── SIDEBAR ────────────────────────────────────────────────── */
.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  overflow:hidden;
  transition:transform .3s ease;
  z-index:200;
}

/* Mobile: sidebar slides in as drawer */
@media(max-width:768px){
  .sidebar{
    position:absolute;top:0;left:0;bottom:0;
    width:min(var(--sidebar-w), 85vw);
    transform:translateX(-100%);
    box-shadow:var(--shadow);
  }
  .sidebar.open{transform:translateX(0)}
}

.sb-section{padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-label{font-size:10px;font-weight:700;letter-spacing:.7px;color:var(--muted);margin-bottom:5px;text-transform:uppercase}

/* ── SEARCH INPUT ───────────────────────────────────────────── */
.search-wrap{position:relative}
.search-wrap input{
  width:100%;padding:9px 10px 9px 32px;
  border:1px solid var(--border);border-radius:7px;
  font-size:14px;background:var(--bg);color:var(--text);
  font-family:inherit;
  min-height:44px; /* touch target */
}
.search-wrap input:focus{outline:none;border-color:var(--brand)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}

/* ── STATUS BUTTONS ─────────────────────────────────────────── */
.status-row{display:flex;flex-wrap:wrap;gap:5px}
.sbtn{
  padding:6px 10px;border-radius:10px;font-size:12px;
  border:1px solid var(--border);cursor:pointer;
  background:var(--surface);color:var(--muted);
  font-family:inherit;transition:all .15s;
  min-height:36px;
}
.sbtn.on{background:var(--brand);border-color:var(--brand);color:white}

/* ── CATEGORY LIST ──────────────────────────────────────────── */
.cat-row{
  display:flex;align-items:center;gap:7px;
  padding:6px 6px;border-radius:6px;cursor:pointer;
  font-size:12px;user-select:none;transition:background .1s;
  min-height:36px;
}
.cat-row:hover{background:var(--bg)}.cat-row.off{opacity:.35}
.cat-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.cat-count{margin-left:auto;font-size:10px;color:var(--muted);background:var(--bg);padding:1px 6px;border-radius:8px}

/* ── ORG LIST ───────────────────────────────────────────────── */
.org-scroll{flex:1;overflow-y:auto;padding:6px;-webkit-overflow-scrolling:touch}
.org-scroll::-webkit-scrollbar{width:3px}
.org-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.result-info{font-size:10px;font-weight:600;letter-spacing:.5px;color:var(--muted);padding:2px 4px 5px;text-transform:uppercase}
.load-status{font-size:10px;color:var(--muted);padding:0 4px 5px;font-style:italic}
.org-item{
  padding:8px 9px;border-radius:7px;cursor:pointer;
  border:1px solid var(--border);margin-bottom:4px;
  display:flex;align-items:flex-start;gap:7px;
  transition:all .15s;min-height:48px; /* comfortable touch target */
}
.org-item:active{background:var(--brand-light);border-color:var(--brand)}
.org-item.sel{border-color:var(--accent);background:var(--accent-light)}
.org-name{font-size:12px;font-weight:600;line-height:1.3}
.org-meta{font-size:10px;color:var(--muted);margin-top:2px;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tag{font-size:9px;padding:1px 5px;border-radius:4px;font-weight:700}
.tag-active{background:#E8F5E9;color:#1B5E20}
.tag-target{background:#FFF8E1;color:#C75000}

/* ── MAP CONTAINER ──────────────────────────────────────────── */
.map-container{flex:1;position:relative;overflow:hidden}
#gmap{width:100%;height:100%;touch-action:none}

/* ── MOBILE TOGGLE BUTTON (hamburger) ───────────────────────── */
.sidebar-toggle{
  display:none;
  position:absolute;top:10px;left:10px;
  width:40px;height:40px;
  background:white;border:1px solid var(--border);
  border-radius:8px;cursor:pointer;
  align-items:center;justify-content:center;
  font-size:18px;z-index:201;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}
@media(max-width:768px){
  .sidebar-toggle{display:flex}
}

/* ── SIDEBAR OVERLAY (mobile) ───────────────────────────────── */
.sidebar-overlay{
  display:none;
  position:absolute;inset:0;
  background:rgba(0,0,0,.4);
  z-index:199;
  opacity:0;transition:opacity .3s;
}
.sidebar-overlay.visible{opacity:1}
@media(max-width:768px){
  .sidebar-overlay{display:block}
}

/* ── MAP LEGEND ─────────────────────────────────────────────── */
.map-legend{
  position:absolute;bottom:80px;right:8px;
  background:white;border-radius:10px;
  padding:9px 12px;border:1px solid var(--border);
  font-size:10px;box-shadow:0 2px 8px rgba(0,0,0,.08);
  z-index:100;min-width:140px;
  max-height:50vh;overflow-y:auto;
}
@media(max-width:768px){
  .map-legend{display:none} /* hidden on mobile — shown via button */
}
.legend-title{font-weight:700;font-size:11px;margin-bottom:6px}
.legend-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

/* ── POPUP CARD ─────────────────────────────────────────────── */
#popup{
  position:absolute;
  background:white;
  border-radius:14px;
  box-shadow:var(--shadow);
  display:none;
  z-index:150;
  overflow:hidden;
  border:1px solid var(--border);
  flex-direction:column;
  /* Size and position set by JS based on screen size */
}
#popup.visible{display:flex}

/* Mobile: popup as bottom sheet */
@media(max-width:768px){
  #popup{
    position:fixed !important;
    left:0 !important; right:0 !important;
    bottom:0 !important; top:auto !important;
    width:100% !important;
    border-radius:18px 18px 0 0;
    max-height:70vh;
  }
  #popup .popup-strip{height:4px}
  /* Drag handle */
  #popup::before{
    content:'';display:block;
    width:36px;height:4px;
    background:var(--border);border-radius:2px;
    margin:10px auto 0;flex-shrink:0;
  }
}

.popup-close{
  position:absolute;top:10px;right:12px;
  width:28px;height:28px;
  background:rgba(0,0,0,.12);border:none;border-radius:50%;
  cursor:pointer;font-size:13px;color:white;
  display:flex;align-items:center;justify-content:center;
  z-index:10;font-family:inherit;
  min-width:28px;min-height:28px; /* touch target */
}
.popup-close:hover{background:rgba(0,0,0,.25)}
.popup-strip{height:5px;flex-shrink:0}
.popup-sv{width:100%;height:140px;object-fit:cover;display:block;flex-shrink:0;background:#eee}
@media(max-width:768px){.popup-sv{height:120px}}
.popup-logo-wrap{
  position:absolute;top:130px;left:13px;
  width:44px;height:44px;border-radius:10px;
  background:white;border:2.5px solid white;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
  overflow:hidden;display:flex;align-items:center;justify-content:center;z-index:5;
}
@media(max-width:768px){.popup-logo-wrap{top:112px}}
.popup-logo{width:40px;height:40px;object-fit:contain}
.popup-logo-fb{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:white}
.popup-body{
  padding:26px 14px 14px;
  overflow-y:auto;flex:1;
  -webkit-overflow-scrolling:touch;
  padding-bottom:calc(14px + var(--safe-bottom));
}
.popup-body::-webkit-scrollbar{width:3px}
.popup-name{font-size:15px;font-weight:700;line-height:1.3;margin-bottom:2px}
.popup-city{font-size:12px;color:var(--muted);margin-bottom:8px}
.popup-badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.popup-badge{font-size:10px;padding:3px 8px;border-radius:10px;font-weight:600}
.intel-box{background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:9px}
.intel-title{font-size:9px;font-weight:700;letter-spacing:.7px;color:var(--muted);text-transform:uppercase;margin-bottom:7px}
.intel-row{display:flex;gap:8px;margin-bottom:5px;font-size:12px;align-items:flex-start}
.intel-row:last-child{margin-bottom:0}
.intel-icon{font-size:13px;flex-shrink:0}
.intel-label{font-weight:600;min-width:72px;flex-shrink:0}
.intel-val{color:var(--muted);line-height:1.4;word-break:break-word}
.next-steps{background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:9px}
.next-item{display:flex;gap:7px;margin-bottom:5px;font-size:12px;color:var(--muted);line-height:1.4}
.popup-actions{display:flex;gap:6px;margin-top:2px;flex-wrap:wrap}
.popup-btn{
  flex:1;padding:10px;border-radius:8px;
  font-size:13px;font-weight:600;cursor:pointer;
  font-family:inherit;text-align:center;text-decoration:none;
  display:block;border:none;transition:all .15s;
  min-height:44px;display:flex;align-items:center;justify-content:center;
}
.pbtn-primary{background:var(--brand);color:white}
.pbtn-secondary{background:var(--bg);color:var(--brand);border:1px solid var(--border)}

/* ── MOBILE BOTTOM ACTION BAR ───────────────────────────────── */
.mobile-bar{
  display:none;
  position:absolute;bottom:0;left:0;right:0;
  background:white;border-top:1px solid var(--border);
  padding:8px 12px calc(8px + var(--safe-bottom));
  gap:8px;z-index:100;
}
@media(max-width:768px){.mobile-bar{display:flex}}
.mobile-bar-btn{
  flex:1;padding:10px;border-radius:8px;
  font-size:12px;font-weight:600;cursor:pointer;
  font-family:inherit;text-align:center;
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  min-height:44px;
}
.mobile-bar-btn.active-mb{background:var(--brand);color:white;border-color:var(--brand)}

/* ── ZOOM CONTROLS ──────────────────────────────────────────── */
.zoom-ctrl{
  position:absolute;top:10px;right:10px;
  display:flex;flex-direction:column;gap:4px;z-index:100;
}
@media(max-width:768px){.zoom-ctrl{right:8px;top:60px}}
.zoom-btn{
  width:36px;height:36px;
  background:white;border:1px solid var(--border);
  border-radius:7px;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,.08);font-family:inherit;color:var(--text);
}

/* ── CITY TOGGLE ────────────────────────────────────────────── */
.city-toggle{
  position:absolute;top:10px;left:10px;
  background:white;border:1px solid var(--border);
  border-radius:8px;padding:8px 10px;z-index:100;
  box-shadow:0 1px 4px rgba(0,0,0,.08);font-size:11px;
}
@media(max-width:768px){.city-toggle{display:none}} /* replaced by sidebar on mobile */
.city-toggle-title{font-weight:700;color:var(--muted);letter-spacing:.5px;margin-bottom:5px;text-transform:uppercase;font-size:9px}
.city-row-ctrl{display:flex;align-items:center;gap:5px;margin-bottom:3px;cursor:pointer;font-size:11px;min-height:24px}
.city-row-ctrl:last-child{margin-bottom:0}
.city-row-ctrl label{cursor:pointer}

/* ── DASHBOARD ──────────────────────────────────────────────── */
.dash-wrap{flex:1;overflow-y:auto;padding:1rem;-webkit-overflow-scrolling:touch}
.dash-wrap::-webkit-scrollbar{width:4px}
.dash-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.dash-metrics{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:10px;margin-bottom:1.25rem;
}
.metric-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.85rem 1rem}
.metric-val{font-size:24px;font-weight:700;color:var(--brand)}
.metric-label{font-size:11px;color:var(--muted);margin-top:3px}
.metric-sub{font-size:10px;color:var(--muted);margin-top:2px}
.dash-section{margin-bottom:1.75rem}
.dash-section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;flex-wrap:wrap;gap:6px}
.dash-section-title{font-size:14px;font-weight:700}
.dash-section-badge{font-size:11px;padding:3px 10px;border-radius:10px;font-weight:600}

/* Responsive table — card view on mobile */
.dash-table{width:100%;border-collapse:collapse;font-size:12px;background:var(--surface);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
.dash-table th{padding:9px 10px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);background:var(--bg);white-space:nowrap}
.dash-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.dash-table tr:last-child td{border-bottom:none}
.dash-table tr:hover td{background:#FAFAF8}

/* On small screens, hide less important columns */
@media(max-width:768px){
  .dash-table .col-hide{display:none}
  .dash-table td{padding:8px 8px;font-size:11px}
  .dash-table th{padding:8px 8px;font-size:9px}
}
@media(max-width:480px){
  .dash-table .col-hide-sm{display:none}
}

.score-wrap{display:flex;align-items:center;gap:5px}
.score-bar{height:4px;border-radius:2px;background:#EEE;width:40px;flex-shrink:0}
.score-fill{height:4px;border-radius:2px;background:var(--brand)}
.dash-tag{font-size:10px;padding:2px 6px;border-radius:5px;font-weight:600;white-space:nowrap}
.dt-food{background:#FDE8D4;color:#7B3300}.dt-homeless{background:#E3EEF9;color:#0C3B6E}
.dt-foster{background:#F3E5F5;color:#4A148C}.dt-youth{background:#E8F5E9;color:#1B5E20}
.dt-health{background:#FDECEA;color:#7F1919}.dt-seniors{background:#FFF8E1;color:#5D3900}
.dt-multi{background:#ECEFF1;color:#263238}.dt-faith{background:#EDE7F6;color:#311B92}
.dt-disability{background:#E0F7FA;color:#006064}.dt-dv{background:#FCE4EC;color:#880E4F}
.dt-mental{background:#F3E5F5;color:#6A1B9A}.dt-arts{background:#FFF3E0;color:#E65100}
.pri-high{color:#B71C1C;font-weight:700}.pri-med{color:#E65100;font-weight:600}.pri-low{color:#2E7D32;font-weight:600}
.city-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:3px;vertical-align:middle}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🤝</div>
    <div>
      <div class="logo-text">JustServe AZ — East Valley</div>
      <div class="logo-sub">Alma Stake Outreach Tool</div>
    </div>
  </div>
  <div class="hstats">
    <div><div class="hstat-val" id="hA">—</div><div class="hstat-label">Active</div></div>
    <div><div class="hstat-val amber" id="hT">—</div><div class="hstat-label">Targets</div></div>
    <div class="hstat-desktop"><div class="hstat-val purple" id="hF">—</div><div class="hstat-label">Foster</div></div>
  </div>
</header>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('map',this)">🗺 Map</button>
  <button class="tab-btn" onclick="switchTab('dash',this)">📊 Dashboard</button>
</div>

<div class="app">

  <!-- ── MAP TAB ── -->
  <div id="tab-map" class="tab-content active">

    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sb-section">
        <div class="sb-label">Search</div>
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="srch" placeholder="Search organizations..." autocomplete="off">
        </div>
      </div>
      <div class="sb-section">
        <div class="sb-label">Status</div>
        <div class="status-row">
          <button class="sbtn on" data-s="all" onclick="setStatus(this)">All</button>
          <button class="sbtn" data-s="active" onclick="setStatus(this)">✓ Active</button>
          <button class="sbtn" data-s="target" onclick="setStatus(this)">⊕ Targets</button>
          <button class="sbtn" data-s="foster" onclick="setStatus(this)">❤ Foster</button>
        </div>
      </div>
      <div class="sb-section">
        <div class="sb-label">Category</div>
        <div id="catList"></div>
      </div>
      <!-- City toggles inside sidebar on mobile -->
      <div class="org-scroll">
        <div class="result-info">Orgs (<span id="oCount">…</span>)</div>
        <div class="load-status" id="loadStatus">Loading live data…</div>
        <div id="orgList"></div>
      </div>
    </div>

    <!-- Map -->
    <div class="map-container">
      <div id="gmap"></div>

      <!-- Mobile hamburger -->
      <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" aria-label="Open filters">☰</button>

      <!-- City boundary overlay removed -->

      <!-- Zoom controls -->
      <div class="zoom-ctrl">
        <button class="zoom-btn" onclick="gmap&&gmap.setZoom(gmap.getZoom()+1)" aria-label="Zoom in">+</button>
        <button class="zoom-btn" onclick="gmap&&gmap.setZoom(gmap.getZoom()-1)" aria-label="Zoom out">−</button>
        <button class="zoom-btn" onclick="resetMap()" aria-label="Reset map" style="font-size:13px">⌂</button>
      </div>

      <!-- Desktop legend -->
      <div class="map-legend">
        <div class="legend-title">Legend</div>
        <div id="legendRows"></div>
        <div style="margin-top:7px;padding-top:7px;border-top:1px solid #eee">
          <div class="legend-row"><div class="legend-dot" style="background:#1B5E4F"></div><span style="color:#6B6B6B">On JustServe</span></div>
          <div class="legend-row"><div class="legend-dot" style="background:white;border:2px solid #E8A020;box-sizing:border-box"></div><span style="color:#6B6B6B">Expansion target</span></div>
        </div>
      </div>

      <!-- Popup card -->
      <div id="popup">
        <div class="popup-strip" id="ppStrip"></div>
        <button class="popup-close" onclick="closePopup()" aria-label="Close">✕</button>
        <img id="ppSV" class="popup-sv" src="" alt="Street View">
        <div class="popup-logo-wrap">
          <img id="ppLogo" class="popup-logo" src="" alt="logo" onerror="handleLogoErr()">
          <div id="ppLogoFb" class="popup-logo-fb" style="display:none"></div>
        </div>
        <div class="popup-body">
          <div class="popup-name" id="ppName"></div>

// ── LIVE DATA LOADER WITH GEOCODING ──────────────────────────
// Geocode cache - persists during session to avoid repeated API calls
const geocodeCache = {};

// Use Maps JS API Geocoder (works with existing key, no extra API needed)
let _geocoder = null;
function getGeocoder(){
  // Only create geocoder after Maps API is loaded
  if(!_geocoder && typeof google !== 'undefined' && google.maps && google.maps.Geocoder){
    _geocoder = new google.maps.Geocoder();
  }
  return _geocoder;
}

function geocodeAddress(address) {
  if(!address || address.length < 10) return Promise.resolve(null);
  if(geocodeCache[address]) return Promise.resolve(geocodeCache[address]);
  
  let geocoder = getGeocoder();
  if(!geocoder) {
    // Geocoder not ready - create it now if Maps API is loaded
    if(typeof google !== 'undefined' && google.maps && google.maps.Geocoder) {
      _geocoder = new google.maps.Geocoder();
      geocoder = _geocoder;
    } else {
      console.warn('Geocoder not ready, Maps API not loaded yet:', address);
      return Promise.resolve(null);
    }
  }
  
  return new Promise(resolve => {
    geocoder.geocode({address}, (results, status) => {
      if(status === 'OK' && results[0]) {
        const loc = results[0].geometry.location;
        const coords = {lat: loc.lat(), lng: loc.lng()};
        geocodeCache[address] = coords;
        resolve(coords);
      } else {
        console.warn('Geocode failed:', address, status);
        resolve(null);
      }
    });
  });
}

function orgFromData(o, coords) {
  const domain = DOMAIN_MAP[o.name] || (o.website ? o.website.replace(/^https?:\/\//, '').split('/')[0] : null);
  const nextArr = o.nextSteps ? o.nextSteps.split(/[.\n]/).map(s => s.trim()).filter(s => s.length > 10) : [];
  
  // Only place a pin if we have a real geocoded address.
  // No guessing — orgs without verified coordinates are listed 
  // in the sidebar but not shown on the map until an address is added.
  const hasExactCoords = !!coords;
  const lat = hasExactCoords ? coords.lat : null;
  const lng = hasExactCoords ? coords.lng : null;

  return {
    name:      o.name,
    city:      o.city,
    lat,
    lng,
    geocoded:  hasExactCoords,
    mappable:  hasExactCoords, // only true if we have a verified location
    cat:       catIdFromLabel(o.category),
    status:    o.status === 'Active' ? 'active' : o.status === 'Target' ? 'target' : 'inactive',
    proj:      Number(o.projects) || 0,
    size:      o.size || 'Medium',
    score:     Number(o.score) || 0,
    admin:     o.adminName || null,
    added:     o.dateAdded || null,
    pri:       o.priority || 'Medium',
    phone:     o.phone || null,
    email:     o.email || null,
    address:   o.address || null,
    domain,
    url:       o.website ? 'https://' + o.website.replace(/^https?:\/\//, '') : null,
    faith:     o.faith || null,
    note:      o.notes || '',
    next:      nextArr,
  };
}

function loadOrgsFromGitHub(){
  const url = 'https://raw.githubusercontent.com/iamalexmay-lab/justserve-az-map/main/orgs.json?cache=' + Date.now();
  const statusEl = document.getElementById('loadStatus');

  fetch(url)
    .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(async data => {
      const rawOrgs = data.orgs || [];
      if(statusEl) { statusEl.textContent = 'Geocoding ' + rawOrgs.length + ' locations...'; statusEl.style.color = 'var(--accent)'; }

      // Geocode all orgs with addresses in parallel batches of 10
      const BATCH = 10;
      const results = [];
      
      for(let i = 0; i < rawOrgs.length; i += BATCH) {
        const batch = rawOrgs.slice(i, i + BATCH);
        // Wrap each geocode in safe catch so one failure doesn't kill the batch
        const geocoded = await Promise.all(
          batch.map(o => o.address 
            ? geocodeAddress(o.address).catch(()=>null) 
            : Promise.resolve(null)
          )
        );
        batch.forEach((o, j) => results.push(orgFromData(o, geocoded[j])));
        
        // Render progressively — show orgs as they're geocoded
        ORGS = [...results];
        buildOrgList();
        if(gmap) buildMarkers();
        
        const done = Math.min(i + BATCH, rawOrgs.length);
        if(statusEl) statusEl.textContent = `Geocoding... ${done}/${rawOrgs.length}`;
      }

      ORGS = results;

      const exactCount = ORGS.filter(o => o.geocoded).length;
      console.log(`✅ Loaded ${ORGS.length} orgs: ${exactCount} geocoded exactly, ${ORGS.length - exactCount} estimated`);

      updateStats();
      buildCatList();
      buildLegend();
      buildOrgList();
      buildDashboard();
      if(gmap) buildMarkers();

      if(statusEl) {
        const unmapped = ORGS.length - exactCount;
        statusEl.textContent = `${ORGS.length} orgs · ${exactCount} on map · ${unmapped>0?unmapped+' need address':'all located'}`;
        statusEl.style.color = 'var(--brand)';
      }
    })
    .catch(err => {
      console.error('Load failed:', err);
      if(statusEl) { statusEl.textContent = '⚠ Could not load live data'; statusEl.style.color = '#C75000'; }
    });
}
function catIdFromLabel(label){
  if(!label) return 'multi';
  const l=label.trim().toLowerCase();
  if(l.includes('food')||l.includes('hunger')) return 'food';
  if(l.includes('homeless')||l.includes('housing')||l.includes('shelter')) return 'homeless';
  if(l.includes('foster')) return 'foster';
  if(l.includes('youth')||l.includes('education')||l.includes('school')||l.includes('child')) return 'youth';
  if(l.includes('health')||l.includes('hospice')||l.includes('medical')) return 'health';
  if(l.includes('senior')||l.includes('elder')||l.includes('aging')) return 'seniors';
  if(l.includes('faith')||l.includes('church')||l.includes('religious')) return 'faith';
  if(l.includes('disabilit')) return 'disability';
  if(l.includes('domestic')||l.includes('violence')||l.includes(' dv')) return 'dv';
  if(l.includes('mental')) return 'mental';
  if(l.includes('art')||l.includes('cultur')||l.includes('music')) return 'arts';
  if(l.includes('multi')||l.includes('service')||l.includes('community')) return 'multi';
  // Exact match fallback
  const exact={'food & hunger':'food','homeless/housing':'homeless','foster care':'foster','youth & education':'youth','health & hospice':'health','seniors':'seniors','multi-service':'multi','faith-based':'faith','disability services':'disability','domestic violence':'dv','mental health':'mental','arts & culture':'arts'};
  return exact[l]||'multi';
}

function fromLatLngToPoint(lat,lng){
  try {
    const proj=gmap.getProjection(),bounds=gmap.getBounds();
    if(!proj||!bounds) return{x:200,y:200};
    const ne=bounds.getNorthEast(),sw=bounds.getSouthWest();
    const p=proj.fromLatLngToPoint(new google.maps.LatLng(lat,lng));
    const tl=proj.fromLatLngToPoint(new google.maps.LatLng(ne.lat(),sw.lng()));
    const z=Math.pow(2,gmap.getZoom());
    return{x:(p.x-tl.x)*z,y:(p.y-tl.y)*z};
  } catch(e) {
    return{x:200,y:200};
  }
}

  // West:  AZ-101     |  East:  S Dobson Rd area
  const stakeCoords = [
    {lat: 33.4148889, lng: -111.8908056}, // NW — E Main St & 101  (33°24'53.6"N 111°53'26.9"W)
    {lat: 33.4154167, lng: -111.8403056}, // NE — E Main St & Dobson (33°24'55.5"N 111°50'25.1"W)
    {lat: 33.3352778, lng: -111.8420278}, // SE — W Warner Rd & Dobson (33°20'07.0"N 111°50'31.3"W)
    {lat: 33.3347778, lng: -111.8923611}, // SW — W Warner Rd & 101  (33°20'05.2"N 111°53'32.5"W)
  ];

  window.stakePolygon = new google.maps.Polygon({
    paths: stakeCoords,
    map: gmap,
    strokeColor: '#C8960C',
    strokeOpacity: 0.95,
    strokeWeight: 3,
    fillColor: '#F5D020',
    fillOpacity: 0.08,
    zIndex: 10,
  });

  // Stake label using AdvancedMarkerElement
  const stakeLabelEl = document.createElement('div');
  stakeLabelEl.style.cssText = 'background:#C8960C;color:white;font-family:Arial,sans-serif;font-weight:bold;font-size:12px;padding:5px 12px;border-radius:6px;opacity:0.95;white-space:nowrap;pointer-events:none;';
  stakeLabelEl.textContent = '✦ Alma Stake Boundary';
  const AME = window._AdvancedMarkerElement;
  if(AME) {
    window.stakeLabel = new AME({
      position: {lat: 33.3750903, lng: -111.866375},
      map: gmap,
      content: stakeLabelEl,
      title: 'Alma Stake Boundary',
      zIndex: 11,
    });
  }
}
window.toggleStake=function(cb){
  const show = cb.checked;
  if(window.stakePolygon) window.stakePolygon.setVisible(show);
  if(window.stakeLabel)   window.stakeLabel.setVisible(show);
  // Sync all stake checkboxes
  ['cStake','cStakeDesktop'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.checked=show;
  });
};



// ── FILTERS ──────────────────────────────────────────────────
let activeStatus='all',activeCats=new Set(CATS.map(c=>c.id)),srch='',selIdx=-1;
function isVis(o){
  const sOk=activeStatus==='all'||(activeStatus==='active'&&o.status==='active')||(activeStatus==='target'&&o.status==='target')||(activeStatus==='foster'&&o.cat==='foster');
  return sOk&&activeCats.has(o.cat)&&(!srch||o.name.toLowerCase().includes(srch)||o.city.toLowerCase().includes(srch));
}
window.setStatus=function(btn){
  activeStatus=btn.dataset.s;
  document.querySelectorAll('.sbtn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
  closePopup();buildOrgList();buildMarkers();
};
function buildCatList(){
  const c=document.getElementById('catList');c.innerHTML='';
  CATS.forEach(cat=>{
    const cnt=ORGS.filter(o=>o.cat===cat.id).length;
    if(!cnt)return;
    const row=document.createElement('div');row.className='cat-row';
    row.innerHTML=`<div class="cat-dot" style="background:${cat.color}"></div><span style="flex:1">${cat.label}</span><span class="cat-count">${cnt}</span>`;
    let on=true;
    row.addEventListener('click',()=>{
      on=!on;
      if(on){activeCats.add(cat.id);row.classList.remove('off');}
      else{activeCats.delete(cat.id);row.classList.add('off');}
      closePopup();buildOrgList();buildMarkers();
    });
    c.appendChild(row);
  });
}
function buildLegend(){
  document.getElementById('legendRows').innerHTML=CATS.filter(c=>ORGS.some(o=>o.cat===c.id)).map(c=>`<div class="legend-row"><div class="legend-dot" style="background:${c.color}"></div><span style="color:#6B6B6B">${c.label}</span></div>`).join('');
}
function buildOrgList(){
  const vis = ORGS.filter(isVis);
  document.getElementById('oCount').textContent = vis.length;
  document.getElementById('orgList').innerHTML = vis.map(o => {
    const col = catColor(o.cat);
    const statusTag = o.status === 'active'
      ? '<span class="tag tag-active">✓</span>'
      : '<span class="tag tag-target">⊕</span>';
    const noAddrStyle = o.mappable ? '' : 'opacity:0.65;border-style:dashed;';
    const noAddrTag = o.mappable ? '' : '<span class="tag" style="background:#FFF3E0;color:#E65100;font-size:9px">No address</span>';
    const safeName = (o.name || 'Unknown').replace(/'/g, "\'");
    const projBadge = o.proj > 0 ? '<span>' + o.proj + 'p</span>' : '';
    return '<div class="org-item" style="' + noAddrStyle + '" onclick="flyToOrg(\'' + safeName + '\')">'
      + '<div class="cat-dot" style="background:' + col + ';margin-top:5px;flex-shrink:0"></div>'
      + '<div>'
        + '<div class="org-name">' + (o.name || '') + '</div>'
        + '<div class="org-meta">' + statusTag + noAddrTag
          + '<span>' + (o.city || '') + '</span>'
          + '<span style="color:' + col + '">' + catLabel(o.cat) + '</span>'
          + projBadge
        + '</div>'
      + '</div>'
    + '</div>';
  }).join('');
}
window.flyToOrg=function(name){
  const o=ORGS.find(x=>x.name===name);if(!o)return;
  if(!o.mappable){
    // Show popup without flying — org has no verified location
    openPopupNoMap(o);
    closeSidebar();
    return;
  }
  gmap.panTo({lat:o.lat,lng:o.lng});
  gmap.setZoom(16);
  setTimeout(()=>openPopup(o,null),400);
  closeSidebar();
};

// Show popup centered on screen for orgs with no map location
function openPopupNoMap(o){
  openPopup(o, null);
  // Position popup center-screen since there's no pin to anchor to
  const popup=document.getElementById('popup');
  const isMobile=window.innerWidth<=768;
  if(!isMobile){
    const mc=document.getElementById('gmap').getBoundingClientRect();
    popup.style.left=(mc.width/2 - 170)+'px';
    popup.style.top='40px';
    popup.style.width='340px';
  }
}

function updateStats(){
  document.getElementById('hA').textContent=ORGS.filter(o=>o.status==='active').length;
  document.getElementById('hT').textContent=ORGS.filter(o=>o.status==='target').length;
  document.getElementById('hF').textContent=ORGS.filter(o=>o.cat==='foster').length;
}

// ── DASHBOARD ─────────────────────────────────────────────────
function buildDashboard(){
  const active=ORGS.filter(o=>o.status==='active');
  const targets=ORGS.filter(o=>o.status==='target');
  const foster=ORGS.filter(o=>o.cat==='foster');

  document.getElementById('dashMetrics').innerHTML=[
    {val:ORGS.length,label:'Total organizations',sub:'Across 4 cities'},
    {val:active.length,label:'Active on JustServe',sub:'Posting projects'},
    {val:targets.length,label:'Expansion targets',sub:'Not yet registered'},
    {val:foster.length,label:'Foster care orgs',sub:'DCS-connected'},
  ].map(m=>`<div class="metric-card"><div class="metric-val">${m.val}</div><div class="metric-label">${m.label}</div><div class="metric-sub">${m.sub}</div></div>`).join('');

  function makeTable(orgs){
    return `<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
    <table class="dash-table">
      <thead><tr>
        <th>#</th><th>Organization</th><th class="col-hide">City</th>
        <th>Category</th><th class="col-hide col-hide-sm">Faith</th>
        <th class="col-hide">Admin</th><th>Proj</th>
        <th>Score</th><th>Priority</th>
        <th class="col-hide">Top Next Step</th>
      </tr></thead>
      <tbody>${orgs.sort((a,b)=>b.score-a.score).map((o,i)=>{
        const col=catColor(o.cat),cc=CITY_COLORS[o.city]||'#555';
        return `<tr onclick="switchToMap('${o.name.replace(/'/g,"\'")}')">
          <td style="color:var(--muted);font-size:10px">${i+1}</td>
          <td style="font-weight:600;font-size:11px">${o.name}</td>
          <td class="col-hide"><span class="city-dot" style="background:${cc}"></span>${o.city}</td>
          <td><span class="dash-tag ${catDtClass(o.cat)}">${catLabel(o.cat)}</span></td>
          <td class="col-hide col-hide-sm" style="font-size:11px;color:var(--muted)">${o.faith||'—'}</td>
          <td class="col-hide" style="font-size:11px;color:var(--muted)">${o.admin||'—'}</td>
          <td style="font-size:11px">${o.proj>0?o.proj+'+':'—'}</td>
          <td><div class="score-wrap"><strong style="font-size:11px">${o.score.toFixed(1)}</strong><div class="score-bar"><div class="score-fill" style="width:${Math.round(o.score/10*100)}%"></div></div></div></td>
          <td><span class="${o.pri==='High'?'pri-high':o.pri==='Medium'?'pri-med':'pri-low'}">${o.pri}</span></td>
          <td class="col-hide" style="font-size:11px;color:var(--muted)">${(o.next&&o.next[0])||'—'}</td>
        </tr>`;}).join('')}
      </tbody>
    </table></div>`;
  }

  document.getElementById('dashContent').innerHTML=`
    <div class="dash-section">
      <div class="dash-section-hdr">
        <div class="dash-section-title">✅ Active Partners</div>
        <span class="dash-section-badge" style="background:#E8F5E9;color:#1B5E20">${active.length} orgs</span>
      </div>${makeTable(active)}</div>
    <div class="dash-section">
      <div class="dash-section-hdr">
        <div class="dash-section-title">⊕ Expansion Targets</div>
        <span class="dash-section-badge" style="background:#FFF8E1;color:#C75000">${targets.length} orgs</span>
      </div>${makeTable(targets)}</div>
    <div class="dash-section">
      <div class="dash-section-hdr">
        <div class="dash-section-title">❤ Foster Care</div>
        <span class="dash-section-badge" style="background:#F3E5F5;color:#4A148C">${foster.length} orgs</span>
      </div>${makeTable(foster)}</div>`;
}

// Tap dashboard row → switch to map and open popup
window.switchToMap=function(name){
  switchTab('map',document.querySelector('.tab-btn'));
  setTimeout(()=>window.flyToOrg(name),300);
};

// ── TABS ──────────────────────────────────────────────────────
window.switchTab=function(id,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  else document.querySelector(`[onclick*="${id}"]`).classList.add('active');
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  if(id==='map'&&gmap) google.maps.event.trigger(gmap,'resize');
};

// ── SEARCH ────────────────────────────────────────────────────
const srchInput = document.getElementById('srch');
if(srchInput){
  srchInput.addEventListener('input', e=>{
    srch = e.target.value.toLowerCase().trim();
    closePopup();
    buildOrgList();
    if(gmap) buildMarkers();
  });
  // Clear search on X / escape
  srchInput.addEventListener('keydown', e=>{
    if(e.key === 'Escape'){ srchInput.value=''; srch=''; closePopup(); buildOrgList(); if(gmap) buildMarkers(); }
  });
}

// ── INIT ──────────────────────────────────────────────────────
window.addEventListener('resize',()=>{
  if(popupOpen) closePopup();
  if(gmap) buildMarkers(); // resize marker icons for new screen size
});
</script>
<script>
// Load Google Maps with modern features enabled
function loadGoogleMaps() {
  var script = document.createElement('script');
  script.src = 'https://maps.googleapis.com/maps/api/js?key=AIzaSyCY4EA1BsEnxJD1OvXuQGgs9B-zn6dI3UM&callback=initMap&v=beta&libraries=marker&map_ids=84ff702491f5c89cda6d3b7e';
  script.async = true;
  script.defer = true;
  document.head.appendChild(script);
}
if(document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', loadGoogleMaps);
} else {
  loadGoogleMaps();
}
</script>
</body>
